<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1E1B"/>
      <stop offset="100%" stop-color="#12110F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4E8"/>
      <stop offset="50%" stop-color="#EBE1CE"/>
      <stop offset="100%" stop-color="#D4C5A9"/>
    </linearGradient>
  </defs>

  <!-- Background container with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle luxury inner border frame -->
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.25"/>

  <!-- Homestead Architectural House Icon -->
  <g transform="translate(256, 250)">
    <!-- Roof and main walls -->
    <path d="M-130 15 L0 -95 L130 15 V125 H-130 Z" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Architectural Doorway -->
    <path d="M-55 125 V40 H55 V125" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
